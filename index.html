<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SK-골프캐디</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:#000000; }
  body {
    color:#FFFFFF; height:100dvh; overflow:hidden;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --cardfs:32px; --detailfs:22px; --btnfs:28px;
  }
  body[data-font="large"]  { --cardfs:37px; --detailfs:25px; --btnfs:31px; }
  body[data-font="xlarge"] { --cardfs:42px; --detailfs:28px; --btnfs:34px; }

  .screen { display:none; height:100dvh; flex-direction:column; padding:10px; gap:10px; overflow-y:auto; }
  .screen > :not(.scroll) { flex-shrink:0; }
  .screen.active { display:flex; }
  .scroll { overflow-y:auto; flex:1 1 auto; min-height:0; -webkit-overflow-scrolling:touch; }

  .topbar { display:flex; align-items:center; gap:8px; min-height:56px; }
  .topbar .title { flex:1; font-size:26px; font-weight:bold; color:#FFD400; text-align:center; }
  .smallbtn {
    min-width:56px; min-height:56px; font-size:26px; font-weight:bold;
    background:#000000; color:#FFD400; border:3px solid #FFD400; border-radius:12px; cursor:pointer;
  }
  .smallbtn.on { background:#FFD400; color:#000000; }
  .smallbtn.wide { padding:0 12px; font-size:22px; white-space:nowrap; }
  #lessonBody { font-size:var(--detailfs); line-height:1.55; color:#FFFFFF; }
  #lessonBody p { margin:0 0 14px 0; }
  #lessonBody ul { margin:0 0 16px 0; padding-left:26px; }
  #lessonBody li { margin-bottom:12px; }
  #lessonBody .h { font-size:26px; font-weight:bold; color:#FFD400; margin:16px 0 8px 0; }

  .bigbtn {
    min-height:72px; font-size:var(--btnfs); font-weight:bold; width:100%;
    background:#000000; color:#FFD400; border:3px solid #FFD400; border-radius:14px; cursor:pointer;
    padding:8px;
  }
  .bigbtn.white { color:#FFFFFF; border-color:#FFFFFF; }
  .bigbtn:active { background:#FFD400; color:#000000; }

  /* 홈 */
  #homeGrid { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(4,1fr); gap:10px; }
  #homeGrid .bigbtn { height:100%; font-size:29px; line-height:1.25; }

  /* 거리 선택 */
  #distList { display:flex; flex-direction:column; gap:10px; }

  /* 카드 */
  .cardline {
    border:3px solid #FFD400; border-radius:12px; padding:8px 10px;
    font-size:var(--cardfs); font-weight:bold; line-height:1.25; color:#FFFFFF;
    word-break:keep-all;
  }
  .cardline .k { color:#FFD400; }
  .badge {
    display:inline-block; font-size:18px; font-weight:bold; color:#000000; background:#FFD400;
    border-radius:8px; padding:2px 10px; vertical-align:middle;
  }
  .chipgroup { display:flex; align-items:flex-start; gap:6px; }
  .chipgroup .glabel { font-size:20px; font-weight:bold; color:#FFD400; min-width:52px; padding-top:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; flex:1; }
  .chip {
    min-height:46px; font-size:20px; font-weight:bold; padding:4px 12px;
    background:#000000; color:#FFFFFF; border:2px solid #FFFFFF; border-radius:999px; cursor:pointer;
  }
  .chip.sel { background:#FFD400; color:#000000; border-color:#FFD400; }
  .nocard { font-size:34px; font-weight:bold; color:#FFD400; text-align:center; padding:40px 10px; line-height:1.4; }

  /* 상세 슬라이드 */
  #detailPanel {
    position:fixed; top:0; left:0; width:100%; height:100dvh; background:#000000; z-index:50;
    transform:translateX(105%); transition:transform .28s ease;
    display:flex; flex-direction:column; padding:10px; gap:10px;
  }
  #detailPanel.open { transform:translateX(0); }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tabbtn {
    min-height:64px; font-size:24px; font-weight:bold; background:#000000; color:#FFFFFF;
    border:3px solid #FFFFFF; border-radius:12px; cursor:pointer; padding:6px;
  }
  .tabbtn.sel { background:#FFD400; color:#000000; border-color:#FFD400; }
  #detailBody { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; font-size:var(--detailfs); line-height:1.55; color:#FFFFFF; }
  #detailBody p { margin:0 0 14px 0; }
  #detailBody ul { margin:0 0 14px 0; padding-left:26px; }
  #detailBody li { margin-bottom:10px; }
  .srcbox { border-top:2px solid #FFFFFF; padding-top:10px; font-size:19px; line-height:1.5; color:#FFFFFF; }
  .srcbox .h { color:#FFD400; font-weight:bold; font-size:21px; }

  /* 설정·편집 */
  .menu { display:flex; flex-direction:column; gap:10px; }
  .label { font-size:24px; font-weight:bold; color:#FFD400; margin-top:8px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .row3 .bigbtn.sel { background:#FFD400; color:#000000; }
  textarea, input[type="text"] {
    width:100%; background:#000000; color:#FFFFFF; border:2px solid #FFFFFF; border-radius:10px;
    font-size:22px; padding:10px; font-family:inherit;
  }
  textarea { min-height:76px; }
  .checkrow { display:flex; align-items:center; gap:12px; font-size:26px; font-weight:bold; color:#FFFFFF; padding:10px 0; }
  .checkrow input { width:34px; height:34px; }
  .version { text-align:center; font-size:24px; font-weight:bold; color:#FFD400; padding:18px 0 8px 0; }
  .msg { font-size:26px; font-weight:bold; color:#FFD400; line-height:1.4; text-align:center; padding:8px; }
  .listitem { text-align:left; }

  #toast {
    position:fixed; left:10px; right:10px; bottom:14px; z-index:100;
    background:#FFD400; color:#000000; font-size:24px; font-weight:bold; text-align:center;
    border-radius:12px; padding:16px 10px; display:none; line-height:1.35;
  }
  #updateBanner {
    position:fixed; left:10px; right:10px; top:10px; z-index:100;
    background:#FFD400; color:#000000; font-size:22px; font-weight:bold; text-align:center;
    border-radius:12px; padding:14px 10px; display:none;
  }
</style>
</head>
<body data-font="normal">

<!-- 화면 1: 홈 -->
<div class="screen active" id="scr-home">
  <div class="topbar">
    <div style="flex:1"></div>
    <button class="smallbtn wide" id="btnLessons" aria-label="연습 스윙팁">🏌️ 스윙팁</button>
    <button class="smallbtn" id="btnFavHome" aria-label="즐겨찾기">⭐</button>
    <button class="smallbtn" id="btnSettings" aria-label="설정">⚙️</button>
  </div>
  <div id="homeGrid"></div>
</div>

<!-- 화면 2: 거리 선택 -->
<div class="screen" id="scr-dist">
  <div class="topbar">
    <button class="smallbtn" data-back="dist">⬅</button>
    <div class="title" id="distTitle"></div>
    <button class="smallbtn" data-home="1">🏠</button>
  </div>
  <div id="distList" class="scroll"></div>
</div>

<!-- 화면 3: 카드 -->
<div class="screen" id="scr-card">
  <div class="topbar">
    <button class="smallbtn" data-back="card">⬅</button>
    <div class="title" id="cardTitle"></div>
    <button class="smallbtn" id="btnFav" aria-label="즐겨찾기 별">⭐</button>
    <button class="smallbtn" data-home="1">🏠</button>
  </div>
  <div id="cardBadge"></div>
  <div id="cardLines" style="display:flex;flex-direction:column;gap:8px;"></div>
  <div id="chipArea" style="display:flex;flex-direction:column;gap:6px;"></div>
  <div style="flex:1"></div>
  <button class="bigbtn" id="btnDetail">🔍 상세 원리 및 연습법 보기</button>
</div>

<!-- 즐겨찾기·최근 목록 -->
<div class="screen" id="scr-favs">
  <div class="topbar">
    <button class="smallbtn" data-back="favs">⬅</button>
    <div class="title">⭐ 즐겨찾기 · 최근 본 카드</div>
    <button class="smallbtn" data-home="1">🏠</button>
  </div>
  <div id="favList" class="scroll menu"></div>
</div>

<!-- 연습 스윙팁: 주제 목록 -->
<div class="screen" id="scr-lessons">
  <div class="topbar">
    <button class="smallbtn" data-back="lessons">⬅</button>
    <div class="title">🏌️ 연습 스윙팁</div>
    <button class="smallbtn" data-home="1">🏠</button>
  </div>
  <div style="font-size:22px;font-weight:bold;color:#FFFFFF;">연습장·집에서 공부하는 곳입니다. 필드에서는 홈의 라이 버튼을 쓰세요.</div>
  <div id="lessonList" class="scroll menu"></div>
</div>

<!-- 연습 스윙팁: 주제 내용 -->
<div class="screen" id="scr-lesson">
  <div class="topbar">
    <button class="smallbtn" data-back="lesson">⬅</button>
    <div class="title" id="lessonTitle"></div>
    <button class="smallbtn" data-home="1">🏠</button>
  </div>
  <div id="lessonBody" class="scroll"></div>
</div>

<!-- 설정 -->
<div class="screen" id="scr-settings">
  <div class="topbar">
    <button class="smallbtn" data-back="settings">⬅</button>
    <div class="title">⚙️ 설정</div>
    <button class="smallbtn" data-home="1">🏠</button>
  </div>
  <div class="scroll">
    <div class="label">글자 크기</div>
    <div class="row3" id="fontRow">
      <button class="bigbtn" data-fontbtn="normal">보통</button>
      <button class="bigbtn" data-fontbtn="large">크게</button>
      <button class="bigbtn" data-fontbtn="xlarge">아주 크게</button>
    </div>
    <div class="label">백업 · 카드 관리</div>
    <div class="menu">
      <button class="bigbtn white" id="btnExport">① 백업 내보내기 (파일 저장)</button>
      <button class="bigbtn white" id="btnImportBackup">② 백업 불러오기</button>
      <button class="bigbtn white" id="btnImportCards">③ 카드 내용 불러오기</button>
      <button class="bigbtn white" id="btnRestore">④ 원본 복원 (처음 상태로)</button>
      <button class="bigbtn white" id="btnEdit">⑤ 카드 편집</button>
    </div>
    <div class="msg" id="settingsMsg"></div>
    <div class="version" id="versionLine"></div>
  </div>
</div>

<!-- 카드 편집: 입력 -->
<div class="screen" id="scr-editor">
  <div class="topbar">
    <button class="smallbtn" data-back="editor">⬅</button>
    <div class="title" id="editorTitle">카드 편집</div>
    <button class="smallbtn" data-home="1">🏠</button>
  </div>
  <div class="scroll" id="editorBody">
    <div class="label">🎯 목표 (40자 이내 권장)</div>
    <textarea id="ed-goal"></textarea>
    <div class="label">🏌 셋업 (40자 이내 권장)</div>
    <textarea id="ed-setup"></textarea>
    <div class="label">💬 스윙 한마디 (40자 이내 권장)</div>
    <textarea id="ed-tip"></textarea>
    <div class="label">원리</div>
    <textarea id="ed-principle" style="min-height:120px"></textarea>
    <div class="label">자주 하는 실수와 해결 (한 줄에 하나씩)</div>
    <textarea id="ed-mistakes" style="min-height:110px"></textarea>
    <div class="label">프로 노하우 (한 줄에 하나씩)</div>
    <textarea id="ed-protips" style="min-height:110px"></textarea>
    <div class="label">연습 드릴 (한 줄에 하나씩)</div>
    <textarea id="ed-drills" style="min-height:110px"></textarea>
    <label class="checkrow"><input type="checkbox" id="ed-reviewed"> 검수 완료 (내가 확인함)</label>
    <div class="menu">
      <button class="bigbtn" id="btnEditorSave">💾 저장하기</button>
      <button class="bigbtn white" id="btnEditorRevert">↩ 이 카드만 원본으로 되돌리기</button>
    </div>
    <div class="msg" id="editorMsg"></div>
  </div>
</div>

<!-- 상세 슬라이드 -->
<div id="detailPanel">
  <div class="topbar">
    <button class="smallbtn" id="btnDetailBack">⬅</button>
    <div class="title" id="detailTitle"></div>
    <button class="smallbtn" data-home="1">🏠</button>
  </div>
  <div class="tabs">
    <button class="tabbtn" data-tab="principle">원리</button>
    <button class="tabbtn" data-tab="mistakes">실수와 해결</button>
    <button class="tabbtn" data-tab="pro_tips">프로 노하우</button>
    <button class="tabbtn" data-tab="drills">연습 드릴</button>
  </div>
  <div id="detailBody"></div>
  <div class="srcbox" id="detailSrc"></div>
</div>

<div id="updateBanner">새 버전이 있습니다. 앱을 다시 열어 주세요.</div>
<div id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

function getData() { return imported && imported.app ? imported : DATA; }
function lieObj(id) { return getData().lies.find(function (l) { return l.id === id; }); }
function cardKey(lie, dist) { return lie + "|" + dist; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function distLabel(d) {
  if (d.indexOf("~") === 0) return d.slice(1) + "야드 이하";
  if (d.indexOf("+") > -1) return d.replace("+", "") + "야드 이상";
  return d + "야드";
}
function getCard(lie, dist) {
  const base = getData().cards.find(function (c) { return c.lie === lie && c.distance === dist; });
  if (!base) return null;
  const e = edits[cardKey(lie, dist)];
  if (!e) return base;
  const merged = Object.assign({}, base, e);
  merged.detail = Object.assign({}, base.detail || {}, e.detail || {});
  return merged;
}
let toastTimer = null;

/* ===== 휴대폰 뒤로가기(Back) 버튼 연동 =====
   화면을 옮길마다 기록(history)에 남겨, 휴대폰 뒤로가기 버튼을 눌러도
   앱이 닫히지 않고 이전 화면으로 돌아가게 한다. */
let navStack = ["scr-home"];
let navIdx = 0;
try { history.replaceState({ d: 0 }, ""); } catch (e) {}
function navTo(id) {
  if (navStack[navIdx] === id) { show(id); return; }
  document.getElementById("detailPanel").classList.remove("open");
  navStack = navStack.slice(0, navIdx + 1);
  navStack.push(id); navIdx++;
  try { history.pushState({ d: navIdx }, ""); } catch (e) {}
  show(id);
}
function navApply() {
  const cur = navStack[navIdx];
  const panel = document.getElementById("detailPanel");
  if (cur === "__detail__") { show("scr-card"); panel.classList.add("open"); }
  else {
    panel.classList.remove("open");
    if (cur === "scr-home") renderHome();
    show(cur);
  }
}
function goBackOne() {
  if (navIdx > 0) { try { history.back(); } catch (e) {} }
}
function goHomeNow() {
  goHome();
  if (navIdx > 0) {
    try { history.go(-navIdx); }
    catch (e) { navStack = ["scr-home"]; navIdx = 0; }
  }
}
window.addEventListener("popstate", function (e) {
  navIdx = (e.state && typeof e.state.d === "number") ? e.state.d : 0;
  if (navIdx < 0) navIdx = 0;
  if (navIdx > navStack.length - 1) navIdx = navStack.length - 1;
  navApply();
});
function goHome() {
  document.getElementById("detailPanel").classList.remove("open");
  renderHome(); show("scr-home");
}

function openCard() {
  st.chips = { slope: "flat", pin: "ample", wind: "none" };
  const key = cardKey(st.lie, st.distance);
  recent = [key].concat(recent.filter(function (k) { return k !== key; })).slice(0, 5);
  LS.set(K.recent, recent);
  renderCard();
  navTo("scr-card");
}
function appliedLines(card) {
  const out = { goal: card.goal || "", setup: card.setup || "", tip: card.tip || "" };
  const mods = getData().modifiers || [];
  ["slope", "pin", "wind"].forEach(function (g) {
    const id = st.chips[g];
    if (!id || id === "flat" || id === "ample" || id === "none") return;
    const ov = (card.overrides || {})[id] || {};
    const m = mods.find(function (x) { return x.id === id; }) || {};
    const add = {
      goal: ov.goal !== undefined && ov.goal !== "" ? ov.goal : (m.goal_add || ""),
      setup: ov.setup !== undefined && ov.setup !== "" ? ov.setup : (m.setup_add || ""),
      tip: ov.tip !== undefined && ov.tip !== "" ? ov.tip : (m.tip_add || "")
    };
    ["goal", "setup", "tip"].forEach(function (f) {
      if (add[f]) out[f] = (out[f] ? out[f] + " " : "") + add[f];
    });
  });
  return out;
}
function renderCard() {
  const l = lieObj(st.lie);
  document.getElementById("cardTitle").textContent = l.label + " · " + distLabel(st.distance);
  const card = getCard(st.lie, st.distance);
  const lines = document.getElementById("cardLines");
  const badge = document.getElementById("cardBadge");
  const chipArea = document.getElementById("chipArea");
  const btnD = document.getElementById("btnDetail");
  document.getElementById("btnFav").classList.toggle("on", favs.indexOf(cardKey(st.lie, st.distance)) > -1);
  if (!card) {
    badge.innerHTML = "";
    lines.innerHTML = '<div class="nocard">🚧 준비 중인 카드입니다</div>';
    chipArea.innerHTML = "";
    btnD.style.display = "none";
    return;
  }
  btnD.style.display = "";
  badge.innerHTML = card.reviewed ? "" : '<span class="badge">미검수 (AI 초안)</span>';
  const t = appliedLines(card);
  lines.innerHTML =
    '<div class="cardline"><span class="k">🎯 목표</span> ' + esc(t.goal) + "</div>" +
    '<div class="cardline"><span class="k">🏌 셋업</span> ' + esc(t.setup) + "</div>" +
    '<div class="cardline"><span class="k">💬 한마디</span> ' + esc(t.tip) + "</div>";
  chipArea.innerHTML = "";
  CHIP_GROUPS.forEach(function (cg) {
    const row = document.createElement("div");
    row.className = "chipgroup";
    const lab = document.createElement("div");
    lab.className = "glabel"; lab.textContent = cg.label;
    row.appendChild(lab);
    const wrap = document.createElement("div");
    wrap.className = "chips";
    cg.items.forEach(function (it) {
      const c = document.createElement("button");
      c.className = "chip" + (st.chips[cg.group] === it.id ? " sel" : "");
      c.textContent = it.label;
      c.onclick = function () { st.chips[cg.group] = it.id; renderCard(); };
      wrap.appendChild(c);
    });
    row.appendChild(wrap);
    chipArea.appendChild(row);
  });
}

function downloadJson(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);

}
function tempBackup() {

}
function failImport(msgEl) {
  msgEl.textContent = "불러오기 실패: 파일 내용이 올바르지 않습니다. 기존 내용은 그대로 유지됩니다.";
  toast("불러오기 실패: 파일 내용이 올바르지 않습니다.");
}
function handleFile(file) {
  const msgEl = document.getElementById("settingsMsg");
  const reader = new FileReader();
  reader.onload = function () {
    let obj = null;
    try { obj = JSON.parse(String(reader.result)); } catch (e) { obj = null; }
    if (!obj || typeof obj !== "object") { failImport(msgEl); return; }
    if (st.importKind === "backup") {
      if (!obj.settings || typeof obj.edits !== "object" || !Array.isArray(obj.favs)) { failImport(msgEl); return; }
      tempBackup();
      settings = obj.settings; edits = obj.edits || {}; favs = obj.favs || [];
      LS.set(K.settings, settings); LS.set(K.edits, edits); LS.set(K.favs, favs);
      applyFont(); renderSettings();
      msgEl.textContent = "백업을 불러왔습니다.";
      toast("백업을 불러왔습니다.");
    } else if (st.importKind === "cards") {
      const ok = obj.app && Array.isArray(obj.lies) && Array.isArray(obj.cards) &&
        obj.cards.every(function (c) { return c && c.lie && c.distance; });
      if (!ok) { failImport(msgEl); return; }
      tempBackup();
      imported = obj;
      if (!LS.set(K.imported, imported)) { imported = LS.get(K.imported, null); return; }
      renderSettings();
      msgEl.textContent = "카드 내용을 불러왔습니다. (카드 " + obj.cards.length + "장)";
      toast("카드 내용을 불러왔습니다.");
    }
  };
  reader.onerror = function () { failImport(msgEl); };
  reader.readAsText(file);
}

/* ===== 카드 편집 ===== */
function openEditor() {
  const l = lieObj(st.lie);
  document.getElementById("editorTitle").textContent = "편집 · " + l.label + " " + distLabel(st.distance);
  document.getElementById("editorMsg").textContent = "";
  const card = getCard(st.lie, st.distance) || {
    lie: st.lie, distance: st.distance, goal: "", setup: "", tip: "",
    detail: { principle: "", mistakes: [], pro_tips: [], drills: [] }, reviewed: false
  };
  const d = card.detail || {};
  document.getElementById("ed-goal").value = card.goal || "";
  document.getElementById("ed-setup").value = card.setup || "";
  document.getElementById("ed-tip").value = card.tip || "";
  document.getElementById("ed-principle").value = d.principle || "";
  document.getElementById("ed-mistakes").value = (d.mistakes || []).join("\n");
  document.getElementById("ed-protips").value = (d.pro_tips || []).join("\n");
  document.getElementById("ed-drills").value = (d.drills || []).join("\n");
  document.getElementById("ed-reviewed").checked = !!card.reviewed;
  navTo("scr-editor");
}
function saveEditor() {
  const lines = function (id) {
    return document.getElementById(id).value.split("\n").map(function (s) { return s.trim(); }).filter(function (s) { return s; });
  };
  const key = cardKey(st.lie, st.distance);
  edits[key] = {
    lie: st.lie, distance: st.distance,
    goal: document.getElementById("ed-goal").value.trim(),
    setup: document.getElementById("ed-setup").value.trim(),
    tip: document.getElementById("ed-tip").value.trim(),
    detail: {
      principle: document.getElementById("ed-principle").value.trim(),
      mistakes: lines("ed-mistakes"),
      pro_tips: lines("ed-protips"),
      drills: lines("ed-drills")
    },
    reviewed: document.getElementById("ed-reviewed").checked,
    updated: new Date().toISOString().slice(0, 10)
  };
  if (LS.set(K.edits, edits)) {
    document.getElementById("editorMsg").textContent = "저장했습니다. 카드 화면에 바로 적용됩니다.";
    toast("저장했습니다.");
  }
}

/* ===== 버튼 연결 ===== */
document.getElementById("btnSettings").onclick = function () { renderSettings(); document.getElementById("settingsMsg").textContent = ""; navTo("scr-settings"); };
document.getElementById("btnFavHome").onclick = function () { renderFavs(); navTo("scr-favs"); };
document.getElementById("btnLessons").onclick = function () { renderLessons(); navTo("scr-lessons"); };
document.getElementById("btnDetail").onclick = openDetail;
document.getElementById("btnDetailBack").onclick = function () { goBackOne(); };
document.querySelectorAll(".tabbtn").forEach(function (b) {
  b.onclick = function () { st.tab = b.dataset.tab; renderDetail(); };
});
document.getElementById("btnFav").onclick = function () {
  const key = cardKey(st.lie, st.distance);
  const i = favs.indexOf(key);
  if (i > -1) { favs.splice(i, 1); toast("즐겨찾기를 해제했습니다."); }
  else { favs.push(key); toast("즐겨찾기에 저장했습니다."); }
  LS.set(K.favs, favs);
  renderCard();
};
document.querySelectorAll("[data-home]").forEach(function (b) { b.onclick = goHomeNow; });
document.querySelectorAll("[data-back]").forEach(function (b) {
  b.onclick = function () { goBackOne(); };
});
document.querySelectorAll("[data-fontbtn]").forEach(function (b) {
  b.onclick = function () {
    settings.font = b.dataset.fontbtn;
    LS.set(K.settings, settings);
    applyFont(); renderSettings();
    toast("글자 크기를 바꿨습니다.");
  };
});
document.getElementById("btnExport").onclick = function () {
  downloadJson({
    type: "sk-golf-caddie-backup", app: getData().app,
    settings: settings, edits: edits, favs: favs, exportedAt: new Date().toISOString()
  }, "SK-골프캐디-백업.json");
  toast("백업 파일을 저장했습니다.");
};
const fileInput = document.getElementById("fileInput");
document.getElementById("btnImportBackup").onclick = function () { st.importKind = "backup"; fileInput.value = ""; fileInput.click(); };
document.getElementById("btnImportCards").onclick = function () { st.importKind = "cards"; fileInput.value = ""; fileInput.click(); };
fileInput.onchange = function () { if (fileInput.files && fileInput.files[0]) handleFile(fileInput.files[0]); };
document.getElementById("btnRestore").onclick = function () {
  if (!confirm("원본으로 복원할까요?\n내가 수정한 카드와 불러온 카드 내용이 지워지고 처음 상태로 돌아갑니다.\n(글자 크기와 즐겨찾기는 그대로 둡니다)")) return;
  tempBackup();
  edits = {}; imported = null;
  LS.del(K.edits); LS.del(K.imported);
  renderSettings();
  document.getElementById("settingsMsg").textContent = "원본으로 복원했습니다.";
  toast("원본으로 복원했습니다.");
};
document.getElementById("btnEdit").onclick = function () {
  /* 설정 → 라이 선택을 위해 홈과 같은 라이 목록을 거리 화면 흐름으로 연다 */
  st.distMode = "edit"; st.distFrom = "settings";
  /* 첫 라이를 열기 전에 라이 고르기: 홈 버튼을 편집용으로 잠시 사용 */
  renderHomeForEdit();
};
function renderHomeForEdit() {
  /* 라이 선택 전용 화면으로 거리 화면을 재사용 */
  document.getElementById("distTitle").textContent = "편집할 라이 선택";
  const box = document.getElementById("distList");
  box.innerHTML = "";
  getData().lies.forEach(function (l) {
    const b = document.createElement("button");
    b.className = "bigbtn";
    b.textContent = l.icon + " " + l.label;
    b.onclick = function () { st.distMode = "edit"; st.distFrom = "settings"; openDist(l.id); };
    box.appendChild(b);
  });
  navTo("scr-dist");
}
document.getElementById("btnEditorSave").onclick = saveEditor;
document.getElementById("btnEditorRevert").onclick = function () {
  if (!confirm("이 카드만 원본으로 되돌릴까요? 이 카드에 대한 내 수정 내용이 지워집니다.")) return;
  delete edits[cardKey(st.lie, st.distance)];
  LS.set(K.edits, edits);
  openEditor();
  document.getElementById("editorMsg").textContent = "이 카드를 원본으로 되돌렸습니다.";
  toast("원본으로 되돌렸습니다.");
};

/* ===== 시작 ===== */
applyFont();
renderHome();
renderSettings();

/* ===== 오프라인 설치(서비스 워커) 등록 ===== */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js").then(function (reg) {
    reg.addEventListener("updatefound", function () {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener("statechange", function () {
        if (nw.state === "installed" && navigator.serviceWorker.controller) {
          document.getElementById("updateBanner").style.display = "block";
        }
      });
    });
  }).catch(function () { /* 오프라인 설치를 못 해도 앱은 그대로 쓴다 */ });
}
</script>
</body>
</html>
